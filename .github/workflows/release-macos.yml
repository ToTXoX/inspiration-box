name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MACOS_ARCH: universal
      RELEASE_TAG: ${{ github.ref_name }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Tag 必须类似 v0.2.0 或 v0.3.0-beta.1' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION=${version%%-*}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inspiration-box/package-lock.json
      - name: Install frontend dependencies
        working-directory: inspiration-box
        run: npm ci
      - name: Check desktop bridge and storage
        run: |
          node scripts/check-desktop.cjs
          swift run --package-path macos StateCheck
      - name: Configure optional Developer ID signing and notarization
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE$CERTIFICATE_PASSWORD$APPLE_ID$APPLE_TEAM_ID$APPLE_APP_PASSWORD" ]]; then
            echo 'SIGNING_STATUS=ad-hoc' >> "$GITHUB_ENV"
            exit 0
          fi
          for variable in CERTIFICATE CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "签名与公证配置不完整：$variable" >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/inspiration-release.keychain-db"
          certificate_file="$RUNNER_TEMP/inspiration-certificate.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate_file"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate_file" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then echo '没有找到 Developer ID Application 证书' >&2; exit 1; fi
          xcrun notarytool store-credentials inspiration-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          security default-keychain -d user -s "$keychain"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo 'MACOS_NOTARY_PROFILE=inspiration-release' >> "$GITHUB_ENV"
          echo 'SIGNING_STATUS=notarized' >> "$GITHUB_ENV"
          rm -f "$certificate_file"
      - name: Build universal application
        run: bash scripts/build-macos.sh
      - name: Package ZIP, DMG and SHA-256 checksums
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ github.ref_name }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'NOTES'
          适用于 macOS 13 或更新版本，通用二进制同时支持 Apple Silicon 和 Intel。

          下载 DMG 后，将「灵感匣」拖入 Applications；也可解压 ZIP 后移动应用。
          `.sha256` 文件用于核对安装包校验值。
          NOTES
          if [[ "$SIGNING_STATUS" == notarized ]]; then
            printf '\n此版本已完成 Developer ID 签名与 Apple 公证。\n' >> "$notes"
          else
            printf '\n此版本仅使用 ad-hoc 签名，未完成 Apple 公证。首次打开可能被 macOS 拦截；确认下载来源后，可在「系统设置 → 隐私与安全性」中按系统提示允许打开。\n' >> "$notes"
          fi
          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          # Resume an interrupted draft; never replace assets of an already published release.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if [[ "$(jq -r .isDraft "$RUNNER_TEMP/existing-release.json")" != true ]]; then
              echo '此 tag 已发布；请使用新版本 tag。' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "灵感匣 $RELEASE_TAG" --notes-file "$notes" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file "$notes" "${flags[@]}"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/inspiration-release.keychain-db"
          if [[ -f "$keychain" ]]; then
            security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/inspiration-certificate.p12"
